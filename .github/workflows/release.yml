---
name: Publish npm package

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # SHA-pinned action references exceed the configured line-length limit.
      # yamllint disable rule:line-length
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # yamllint enable rule:line-length
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Check coverage
        run: npm run test:coverage
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Verify tag matches package version
        run: >-
          node --input-type=module -e
          "import { readFileSync } from 'node:fs'; const { version } =
          JSON.parse(readFileSync('package.json', 'utf8')); if
          (process.env.GITHUB_REF_NAME !== 'v' + version) process.exit(1)"
      - name: Publish package with provenance
        run: npm publish --provenance --access public

  create-release:
    needs: publish
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --generate-notes --repo
          "$GITHUB_REPOSITORY"
